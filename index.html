<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Snow Corridor — Christmas Run</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071c2b;color:#f5fbff;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;background:#09283b}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:#071521cc;border:1px solid #ffffff30;border-radius:14px;padding:8px 13px;font-weight:800;box-shadow:0 4px 20px #0005}.heart{color:#ff5366}.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#071521b9;padding:8px 12px;border-radius:12px;font-size:13px;text-align:center;pointer-events:none}.touch{position:fixed;bottom:70px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}.pad,.shoot{pointer-events:auto;display:flex;gap:7px}.touch button{width:54px;height:54px;border:1px solid #ffffff45;border-radius:16px;background:#102e42cc;color:white;font-size:22px;font-weight:bold;touch-action:none}.shoot button{width:70px;background:#b12b3b}.overlay{position:fixed;inset:0;background:#031521cc;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.panel{max-width:520px;background:linear-gradient(160deg,#103850,#071b2b);border:1px solid #ffffff30;border-radius:24px;padding:30px;box-shadow:0 20px 70px #0008}.panel h1{font-size:clamp(28px,6vw,48px);margin:0 0 10px}.panel p{line-height:1.55}.panel button{padding:13px 22px;border:0;border-radius:12px;background:#d83c4b;color:white;font-weight:900;font-size:17px;cursor:pointer}.hidden{display:none}
</style></head><body>
<canvas id="game"></canvas>
<div class="hud"><div class="pill">🎄 Коридор <span id="level">1</span> / 100</div><div class="pill">❤️ <span id="hp" class="heart">100</span></div><div class="pill">❄️ <span id="score">0</span></div></div>
<div class="hint">WASD / стрелки — движение · SPACE — снежок · 100 коридоров</div>
<div class="touch"><div class="pad"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><div class="shoot"><button data-key="Space">❄️</button></div></div>
<div class="overlay" id="start"><div class="panel"><h1>🎄 Snow Corridor 🎄</h1><p>Пробеги 100 рождественских коридоров, отбивайся от снеговиков снежками и постарайся сохранить здоровье!</p><p>Каждое касание снеговика отнимает 1 HP. У тебя 100 жизней.</p><button id="startBtn" type="button" onclick="window.startSnowCorridor()">Начать игру</button></div></div>
<div class="overlay hidden" id="end"><div class="panel"><h1 id="endTitle">🎄 С Новым годом! 🎄</h1><p id="endText"></p><button id="again">Играть снова</button></div></div>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,player,keys={},snowmen=[],shots=[],level=1,hp=100,score=0,active=false,frame=0,invuln=0,doorFlash=0;
const hpEl=document.getElementById('hp'),lvEl=document.getElementById('level'),scoreEl=document.getElementById('score');
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function init(){level=1;hp=100;score=0;frame=0;player={x:W/2,y:H*.78,r:15,speed:4.1};shots=[];keys={};spawn();active=true;document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');hud()}
function spawn(){snowmen=[];let n=Math.min(3+Math.floor(level/5),11);for(let i=0;i<n;i++)snowmen.push({x:100+Math.random()*(W-200),y:80+Math.random()*(H*.38),r:19,h:2,cd:80+Math.random()*100,wiggle:Math.random()*6})}
function hud(){hpEl.textContent=hp;lvEl.textContent=level;scoreEl.textContent=score}
function shoot(){if(!active)return;shots.push({x:player.x,y:player.y-15,vy:-8,r:6})}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key===' '?'Space':e.key]=true;if(e.key===' '&&!e.repeat)shoot()});
document.addEventListener('keyup',e=>keys[e.key===' '?'Space':e.key]=false);
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;if(k==='Space')shoot()});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
window.startSnowCorridor=init;document.getElementById('startBtn').addEventListener('click',init);document.getElementById('again').addEventListener('click',init);
function move(){if(keys.ArrowLeft||keys.a||keys.A)player.x-=player.speed;if(keys.ArrowRight||keys.d||keys.D)player.x+=player.speed;if(keys.ArrowUp||keys.w||keys.W)player.y-=player.speed;if(keys.ArrowDown||keys.s||keys.S)player.y+=player.speed;player.x=Math.max(42,Math.min(W-42,player.x));player.y=Math.max(70,Math.min(H-60,player.y));if(keys.Space&&frame%12===0)shoot()}
function update(){
 if(!active)return;
 frame++;move();if(invuln>0)invuln--;
 snowmen.forEach(s=>{
  s.wiggle+=.04;s.x+=Math.sin(s.wiggle)*.7;s.y+=Math.sin(frame/45+s.wiggle)*.35;s.cd--;
  if(s.cd<=0){shots.push({x:s.x,y:s.y+12,vy:3.2+level*.025,r:7,enemy:true});s.cd=100+Math.random()*100-level*.4}
  if(Math.hypot(s.x-player.x,s.y-player.y)<s.r+player.r&&invuln===0){hp--;invuln=12;if(hp<=0)finish(false)}
 });
 shots=shots.filter(b=>{
  b.y+=b.vy;
  if(b.enemy){
   if(Math.hypot(b.x-player.x,b.y-player.y)<b.r+player.r){
    if(invuln===0){hp-=5;invuln=25;if(hp<=0)finish(false)}
    return false;
   }
  }else{
   for(const s of snowmen){
    if(Math.hypot(b.x-s.x,b.y-s.y)<b.r+s.r){
     s.h--;if(s.h<=0){snowmen=snowmen.filter(x=>x!==s);score+=10;hud()}
     return false;
    }
   }
  }
  return b.y>-20&&b.y<H+20;
 });
 if(snowmen.length===0){doorFlash++;if(doorFlash>60){doorFlash=0;level++;if(level>100){finish(true);return}spawn()}}
 hud();
}
function finish(win){active=false;document.getElementById('endTitle').textContent=win?'🎉 С Новым годом! 🎉':'☃️ Игра окончена!';document.getElementById('endText').textContent=win?'Ты прошёл все 100 коридоров и спас праздник! С Новым годом!':'Ты дошёл до коридора '+level+' из 100. Очки: '+score+'. Попробуй ещё раз!';document.getElementById('end').classList.remove('hidden')}
function draw(){ctx.clearRect(0,0,W,H);let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#08263a');grad.addColorStop(1,'#0c4053');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
// corridor walls & festive garlands
ctx.fillStyle='#061a29';ctx.fillRect(0,0,28,H);ctx.fillRect(W-28,0,28,H);
ctx.strokeStyle='#d5efff24';ctx.lineWidth=2;for(let x=45;x<W-40;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
for(let y=(frame*2)%70;y<H;y+=70){ctx.fillStyle='#e8f8ff55';ctx.fillRect(36,y,W-72,2)}
// garlands
for(let y=24;y<H;y+=110){ctx.font='20px serif';ctx.fillText('🎄',38,y);ctx.fillText('🎄',W-62,y)}
// snow
for(let i=0;i<75;i++){let x=(i*173+frame*.25)%W,y=(i*91+frame*1.1)%H;ctx.fillStyle='#ffffff99';ctx.beginPath();ctx.arc(x,y,1.4+(i%3),0,Math.PI*2);ctx.fill()}
snowmen.forEach(s=>drawSnowman(s));shots.forEach(b=>{ctx.fillStyle=b.enemy?'#ff8b95':'#f4fcff';ctx.shadowBlur=10;ctx.shadowColor=b.enemy?'#ff5260':'#a8f3ff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});
if(player){ctx.save();if(invuln>0&&frame%4<2)ctx.globalAlpha=.5;drawPlayer();ctx.restore()}
if(doorFlash>0){ctx.fillStyle='#fff9';ctx.font='bold 34px sans-serif';ctx.textAlign='center';ctx.fillText('✨ Коридор очищен! ✨',W/2,H/2)}
}
function drawSnowman(s){ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='#f4fbff';ctx.strokeStyle='#b9e8f4';ctx.lineWidth=2;[[0,14,15], [0,-1,11],[0,-14,8]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke()});ctx.fillStyle='#182f3c';ctx.beginPath();ctx.arc(-3,-16,1.7,0,7);ctx.arc(4,-16,1.7,0,7);ctx.fill();ctx.fillStyle='#ff9b40';ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(9,-10);ctx.lineTo(0,-9);ctx.fill();ctx.strokeStyle='#9e3441';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-9,-7);ctx.lineTo(9,-6);ctx.stroke();ctx.fillStyle='#b62e42';ctx.fillRect(-10,-25,20,5);ctx.fillRect(-6,-33,12,9);ctx.strokeStyle='#5e4937';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(-23,4);ctx.moveTo(13,0);ctx.lineTo(23,4);ctx.stroke();ctx.restore()}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#1f8d54';ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f2d1b3';ctx.beginPath();ctx.arc(0,-12,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c9263b';ctx.beginPath();ctx.moveTo(-9,-18);ctx.lineTo(9,-18);ctx.lineTo(4,-27);ctx.lineTo(-4,-27);ctx.closePath();ctx.fill();ctx.fillRect(-10,-19,20,4);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-3,-12,1.2,0,7);ctx.arc(3,-12,1.2,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-8,5,16,5);ctx.fillStyle='#f6fbff';ctx.beginPath();ctx.arc(16,-1,6,0,Math.PI*2);ctx.fill();ctx.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
})();
</script></body></html>
